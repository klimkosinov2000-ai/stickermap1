<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Карта стикеров</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Стили -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Виджет статистики / Топ территорий (слева вверху) -->
  <div class="leaderboard-widget" id="leaderboard-widget">
    <button type="button" class="leaderboard-toggle" id="btn-toggle-leaderboard">
      <span>🏆 Топ территорий</span>
      <span class="leaderboard-arrow" id="leaderboard-arrow">▼</span>
    </button>
    <div class="leaderboard-body hidden" id="leaderboard-body">
      <div class="leaderboard-list" id="leaderboard-list">
        <div class="leaderboard-empty">Загрузка данных...</div>
      </div>
    </div>
  </div>

  <!-- Верхняя панель профиля (справа вверху) -->
  <div class="top-bar">
    <div id="user-panel" class="user-panel">
      <button id="btn-open-auth" class="btn-auth-trigger">Войти / Регистрация</button>
    </div>
  </div>

  <!-- Контейнер карты -->
  <div id="map"></div>

  <!-- Кнопка добавления точки -->
  <button id="btn-add-spot" class="btn-add" title="Добавить стикер">+</button>

  <!-- Модальное окно 1: Вход / Регистрация по почте и паролю + Гость -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-card auth-card">
      <div class="auth-badge">STICKERMAP // TERRITORY</div>
      <h3 class="auth-title">Захвати свой район</h3>
      <p class="auth-subtitle">
        Войди или создай аккаунт один раз — браузер запомнит тебя, и при возвращении на сайт ты сразу будешь в системе.
      </p>

      <form id="email-auth-form" class="auth-form">
        <div class="form-group">
          <label for="auth-email">Электронная почта</label>
          <div class="input-icon-wrap">
            <span class="input-icon">✉️</span>
            <input type="email" id="auth-email" placeholder="tagger@mail.ru" required>
          </div>
        </div>

        <div class="form-group">
          <label for="auth-password">Пароль (от 6 символов)</label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="auth-password" placeholder="••••••" minlength="6" required>
            <button type="button" id="toggle-password" class="toggle-pass-btn" title="Показать пароль">👁️</button>
          </div>
        </div>

        <button type="submit" id="btn-email-submit" class="btn-submit btn-auth-primary">
          Войти / Зарегистрироваться
        </button>
      </form>

      <div class="auth-divider"><span>или</span></div>

      <button type="button" id="btn-guest-mode" class="btn-guest-dark">
        Продолжить как гость
      </button>
    </div>
  </div>

  <!-- Модальное окно 2: Настройка профиля (Ник и Крю) -->
  <div id="profile-modal" class="modal-overlay hidden">
    <div class="modal-card" style="max-width: 360px;">
      <h3>Профиль автора</h3>
      <form id="profile-form">
        <div class="form-group">
          <label>Твой уникальный ник / тег</label>
          <input type="text" id="profile-nickname" placeholder="Например: FORG" maxlength="24" required>
        </div>

        <div class="form-group">
          <label>Формат участия</label>
          <div class="radio-group">
            <label class="radio-card">
              <input type="radio" name="crewType" value="solo" checked>
              <span>Одиночка (Solo)</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="crewType" value="crew">
              <span>Крю / Команда</span>
            </label>
          </div>
        </div>

        <div class="form-group hidden" id="crew-name-group">
          <label>Название крю (определяет цвет твоей зоны)</label>
          <input type="text" id="profile-crew-name" placeholder="Например: UNDERGROUND" maxlength="24">
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-logout" class="btn-cancel" style="color: #e74c3c;">Выйти</button>
          <button type="submit" id="btn-save-profile" class="btn-submit">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модальное окно 3: Создание / Редактирование спота -->
  <div id="spot-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modal-title">Новый стикер</h3>
      <form id="spot-form">
        <input type="hidden" id="spot-id">
        <input type="hidden" id="spot-lat">
        <input type="hidden" id="spot-lng">

        <div class="form-group">
          <label>Название / Тег</label>
          <input type="text" id="input-title" placeholder="Например: Стикер у метро" required>
        </div>

        <div class="form-group">
          <label>Статус</label>
          <select id="select-status">
            <option value="ok">Цел (Территория активна)</option>
            <option value="damaged">Потрёпан / Выцвел</option>
            <option value="gone">Сорван / Закрашен</option>
          </select>
        </div>

        <div class="form-group">
          <label>Описание / Детали</label>
          <textarea id="input-note" rows="2" placeholder="Где именно наклеен, ориентир..."></textarea>
        </div>

        <div class="form-group">
          <label>Фотографии (камера или галерея)</label>
          <input type="file" id="input-photos" accept="image/*" multiple>
          <div id="photos-preview-grid" class="photos-preview-grid"></div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel-modal" class="btn-cancel">Отмена</button>
          <button type="submit" id="btn-save-spot" class="btn-submit">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Полноэкранный просмотрщик (Lightbox) -->
  <div id="lightbox-modal" class="lightbox-overlay hidden">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Просмотр фото">
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf.js для слияния пересекающихся кругов и расчёта площади -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <!-- Основной скрипт -->
  <script src="js/app.js"></script>
</body>
</html>
