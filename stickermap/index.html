<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Карта стикеров</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Собственные стили -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Контейнер карты -->
  <div id="map"></div>

  <!-- Кнопка добавления точки (видна только админу) -->
  <button id="btn-add-spot" class="btn-add admin-only" title="Добавить спот">+</button>

  <!-- Модальное окно: Создание / Редактирование -->
  <div id="spot-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modal-title">Новый спот</h3>
      <form id="spot-form">
        <input type="hidden" id="spot-id">
        <input type="hidden" id="spot-lat">
        <input type="hidden" id="spot-lng">

        <div class="form-group">
          <label>Название / Тег</label>
          <input type="text" id="input-title" placeholder="Например: Стикер у метро" required>
        </div>

        <div class="form-group">
          <label>Статус</label>
          <select id="select-status">
            <option value="ok">Цел</option>
            <option value="damaged">Потрёпан</option>
            <option value="gone">Сорван</option>
          </select>
        </div>

        <div class="form-group">
          <label>Описание</label>
          <textarea id="input-note" rows="2" placeholder="Где именно наклеен, детали..."></textarea>
        </div>

        <div class="form-group">
          <label>Фотографии (можно выбрать несколько)</label>
          <input type="file" id="input-photos" accept="image/*" multiple>
          <!-- Сетка предпросмотра фото перед сохранением -->
          <div id="photos-preview-grid" class="photos-preview-grid"></div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel-modal" class="btn-cancel">Отмена</button>
          <button type="submit" id="btn-save-spot" class="btn-submit">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Полноэкранный просмотрщик (Lightbox) для зума фото -->
  <div id="lightbox-modal" class="lightbox-overlay hidden">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Просмотр фото">
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Основной скрипт -->
  <script src="js/app.js"></script>
</body>
</html>
